name: Release — build & push images (GHCR) & deploy (Azure)

# - push sur main / feature/** : build + push des images sur GHCR (ghcr.io).
# - workflow_dispatch : idem, et permet de cocher `deploy` pour enchaîner Azure.
# Le déploiement Azure ne se fait JAMAIS sur un simple push (inputs.deploy vide → job sauté).
on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: "Déployer sur Azure Container Apps après le push ?"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # publier sur GHCR avec le GITHUB_TOKEN intégré

jobs:
  # -----------------------------------------------------------
  # Build + push des images sur GHCR (matrice)
  # Tags : :latest  et  :sha-<commit>  (immuable, utilisé par le deploy)
  # Images : ghcr.io/<owner>/breezy-<service>
  # -----------------------------------------------------------
  build-push:
    name: Build & push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: auth,          context: services/auth }
          - { service: users,         context: services/users }
          - { service: posts,         context: services/posts }
          - { service: notifications, context: services/notifications }
          - { service: conversations, context: services/conversations }
          - { service: frontend,      context: frontend }
          - { service: gateway,       context: gateway }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action met automatiquement le nom d'image en minuscules.
          images: ghcr.io/${{ github.repository_owner }}/breezy-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_API_URL n'est consommé que par le frontend (ignoré ailleurs).
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------
  # Déploiement Azure Container Apps (optionnel, gated)
  # Ne s'exécute que via "Run workflow" avec `deploy` coché (jamais sur un push).
  # L'environnement `production` doit exiger une approbation manuelle
  # (Settings > Environments > production > Required reviewers).
  # -----------------------------------------------------------
  deploy-azure:
    name: Deploy → Azure Container Apps
    needs: build-push
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write   # OIDC (federated credentials)
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mise à jour des Container Apps (image = sha du commit)
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            set -euo pipefail
            RG="${{ vars.AZURE_RESOURCE_GROUP }}"
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            TAG="sha-${{ github.sha }}"
            for svc in auth users posts notifications conversations frontend gateway; do
              echo "::group::Déploiement breezy-$svc"
              az containerapp update \
                --name "breezy-$svc" \
                --resource-group "$RG" \
                --image "ghcr.io/$OWNER/breezy-$svc:$TAG"
              echo "::endgroup::"
            done
