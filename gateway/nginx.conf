# =============================================================
# Breezy — Reverse proxy / Load balancer (Nginx)
# =============================================================
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;

  log_format breezy '$remote_addr - [$time_iso8601] "$request" '
                    '$status ${body_bytes_sent}o ${request_time}s '
                    '-> $upstream_addr "$http_user_agent"';
  access_log /var/log/nginx/access.log breezy;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 12M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;
  gzip_min_length 512;

  # -----------------------------------------------------------
  # Rate limiting — limites par IP
  # auth       : 20 req/min  (login, register, refresh)
  # api        : 200 req/min (appels API généraux)
  # uploads    : 10 req/min  (téléchargement de médias)
  # -----------------------------------------------------------
  limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=20r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=200r/m;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
  limit_req_status 429;

  # -----------------------------------------------------------
  # Upstreams
  # -----------------------------------------------------------
  upstream auth_svc             { server auth:4001;          }
  upstream users_svc            { server users:4002;         }
  upstream posts_svc            { server posts:4003;         }
  upstream notifications_svc    { server notifications:4004; }
  upstream conversations_svc    { server conversations:4005; }
  upstream frontend_svc         { server frontend:3000;      }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout  10s;
  proxy_send_timeout     30s;
  proxy_read_timeout     30s;

  server {
    listen 80;
    server_name _;

    # ---- En-têtes de sécurité ----
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # unsafe-inline requis par Next.js sans nonce (à remplacer par nonce en Phase 2)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* wss://localhost:*; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ----- Auth : rate limit strict -----
    location /api/auth {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://auth_svc;
    }

    # ----- Autres API : rate limit standard -----
    location /api/users         { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://users_svc;         }
    location /api/posts         { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://posts_svc;         }
    location /api/notifications { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://notifications_svc; }
    location /api/conversations { limit_req zone=api_limit burst=50 nodelay; proxy_pass http://conversations_svc; }

    # Médias — rate limit dédié pour limiter le téléchargement en masse
    location /uploads/ {
      limit_req zone=upload_limit burst=10 nodelay;
      proxy_pass http://posts_svc;
    }

    location = /healthz {
      access_log off;
      return 200 'gateway-ok\n';
    }

    location / {
      proxy_pass http://frontend_svc;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
