# =============================================================
# Breezy — Reverse proxy / Load balancer (Nginx)
# =============================================================
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server_tokens off;

  log_format breezy '$remote_addr - [$time_iso8601] "$request" '
                    '$status ${body_bytes_sent}o ${request_time}s '
                    '-> $upstream_addr "$http_user_agent"';
  access_log /var/log/nginx/access.log breezy;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 12M;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;
  gzip_min_length 512;

  # -----------------------------------------------------------
  # Rate limiting — limites par IP
  # auth       : 20 req/min  (login, register, refresh)
  # api        : 200 req/min (appels API généraux)
  # uploads    : 10 req/min  (téléchargement de médias)
  # -----------------------------------------------------------
  limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=5r/s;
  limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;
  limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
  limit_req_status 429;

  # -----------------------------------------------------------
  # Résolution DNS dynamique (load balancing des répliques)
  #
  # IMPORTANT : avec un bloc `upstream { server auth:4001; }`, nginx résout le nom
  # UNE SEULE FOIS au démarrage → `docker compose up --scale posts=3` n'enverrait
  # tout qu'à une seule réplique. En passant par le resolver DNS de Docker (127.0.0.11)
  # ET une VARIABLE dans proxy_pass, nginx ré-résout à chaque requête et répartit
  # réellement entre les répliques (round-robin du DNS Docker).
  # -----------------------------------------------------------
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout  10s;
  proxy_send_timeout     30s;
  proxy_read_timeout     30s;

  server {
    listen 80;
    server_name _;

    # ---- En-têtes de sécurité ----
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # unsafe-inline requis par Next.js sans nonce (à remplacer par nonce en Phase 2)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:* wss://localhost:*; media-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ----- Auth : rate limit strict -----
    # (variable + $request_uri : proxy_pass avec variable ne réécrit pas l'URI seul)
    location /api/auth {
      limit_req zone=auth_limit burst=20 nodelay;
      set $up_auth auth:4001;
      proxy_pass http://$up_auth$request_uri;
    }

    # ----- Autres API : rate limit standard -----
    location /api/users {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_users users:4002;
      proxy_pass http://$up_users$request_uri;
    }
    location /api/posts {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_posts posts:4003;
      proxy_pass http://$up_posts$request_uri;
    }
    location /api/notifications {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_notifications notifications:4004;
      proxy_pass http://$up_notifications$request_uri;
    }
    location /api/conversations {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_conversations conversations:4005;
      proxy_pass http://$up_conversations$request_uri;
    }

    # ----- API versionnée (/api/v1) — routage identique vers les mêmes services -----
    location /api/v1/auth {
      limit_req zone=auth_limit burst=20 nodelay;
      set $up_auth_v1 auth:4001;
      proxy_pass http://$up_auth_v1$request_uri;
    }
    location /api/v1/users {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_users_v1 users:4002;
      proxy_pass http://$up_users_v1$request_uri;
    }
    location /api/v1/posts {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_posts_v1 posts:4003;
      proxy_pass http://$up_posts_v1$request_uri;
    }
    location /api/v1/notifications {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_notifications_v1 notifications:4004;
      proxy_pass http://$up_notifications_v1$request_uri;
    }
    location /api/v1/conversations {
      limit_req zone=api_limit burst=50 nodelay;
      set $up_conversations_v1 conversations:4005;
      proxy_pass http://$up_conversations_v1$request_uri;
    }

    # Médias — rate limit dédié pour limiter le téléchargement en masse
    location /uploads/ {
      limit_req zone=upload_limit burst=10 nodelay;
      set $up_uploads posts:4003;
      proxy_pass http://$up_uploads$request_uri;
    }

    location = /healthz {
      access_log off;
      return 200 'gateway-ok\n';
    }

    location / {
      set $up_frontend frontend:3000;
      proxy_pass http://$up_frontend$request_uri;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
