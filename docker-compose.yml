# =============================================================
# Breezy — Orchestration locale (Docker Compose)
# Lancement :  docker compose up --build
# Accès      :  http://localhost:8080  (frontend via gateway)
# =============================================================

services:
  # ---------------------------------------------------------
  # Bases de données
  # ---------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ---------------------------------------------------------
  # Microservices
  # ---------------------------------------------------------
  auth:
    build: ./services/auth
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${AUTH_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  users:
    build: ./services/users
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${USERS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  posts:
    build: ./services/posts
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${POSTS_PORT}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  notifications:
    build: ./services/notifications
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${NOTIF_PORT}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  conversations:
    build: ./services/conversations
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${CONV_PORT}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${CONV_PORT}/api/conversations/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ---------------------------------------------------------
  # Seeder — données de démonstration (one-shot, profil "seed")
  # ---------------------------------------------------------
  seeder:
    build: ./services/seeder
    profiles: ["seed"]
    env_file: .env
    environment:
      SEED_USER_COUNT: "1000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [breezy-net]

  # ---------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${FRONTEND_PORT}
      GATEWAY_URL: http://gateway
    depends_on: [auth, users, posts, notifications, conversations]
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  # ---------------------------------------------------------
  # Reverse proxy / Load balancer
  # ---------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [auth, users, posts, notifications, conversations, frontend]
    networks: [breezy-net]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

networks:
  breezy-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  uploads:
